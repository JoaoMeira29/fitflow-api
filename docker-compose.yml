services:
  db:
    image: postgres:16
    environment:
      # Local development credentials. They must match DATABASE_URL in .env.
      POSTGRES_USER: fitflow
      POSTGRES_PASSWORD: fitflow
      POSTGRES_DB: fitflow
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fitflow -d fitflow"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
