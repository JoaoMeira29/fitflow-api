# A TEMPLATE. Do not put real values in this file and do not apply it as is.
#
# Copy it to secret.yaml (which Git ignores), fill it in, and apply that:
#
#   cp k8s/secret.example.yaml k8s/secret.yaml
#   kubectl apply -f k8s/secret.yaml
#
# Generate a JWT secret with:
#   python -c "import secrets; print(secrets.token_urlsafe(64))"
apiVersion: v1
kind: Secret
metadata:
  name: fitflow-secrets
type: Opaque
stringData:
  POSTGRES_PASSWORD: "change-me"
  JWT_SECRET: "change-me-to-a-long-random-string"
  # The password here must be the same as POSTGRES_PASSWORD above.
  DATABASE_URL: "postgresql+asyncpg://fitflow:change-me@fitflow-db:5432/fitflow"
